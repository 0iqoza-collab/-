<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>إدارة المنتجات - العطار محمد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background-color: #1c1d1d;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-photo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(20, 20, 20, 0.88), rgba(15, 15, 15, 0.92)); z-index: -1;
        }

        .main-container {
            width: 100%; max-width: 1000px; margin: 0 auto; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .navbar {
            width: 100%; max-width: 900px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px; padding: 12px 25px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            margin-bottom: 40px;
        }
        .brand-name { font-size: 1.7rem; font-weight: 800; color: #d4af37; text-align: center; }
        .brand-sub { font-size: 0.8rem; color: #e5c060; opacity: 0.85; margin-top: 2px; text-align: center; }

        .hero-title {
            font-size: 2.2rem; font-weight: 800; color: #e5c060; margin-bottom: 10px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6); text-align: center;
        }
        .hero-subtitle { font-size: 1rem; color: #cdb784; opacity: 0.85; margin-bottom: 30px; text-align: center; }

        .back-link {
            align-self: flex-start; display: inline-flex; align-items: center; gap: 8px;
            color: #cdb784; text-decoration: none; font-size: 0.92rem; margin-bottom: 20px; opacity: 0.85;
        }
        .back-link:hover { opacity: 1; color: #e5c060; }

        .panel {
            width: 100%;
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 20px; padding: 28px 24px;
            background: rgba(0, 0, 0, 0.25);
            margin-bottom: 30px;
        }
        .panel h2 {
            font-size: 1.15rem; color: #e5c060; margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .panel h2 i { color: #d4af37; }

        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 0.85rem; color: #cdb784; font-weight: 600; }
        .field input, .field select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 10px; padding: 11px 14px; color: #fff;
            font-size: 0.95rem; outline: none; transition: border-color 0.2s;
        }
        .field input:focus, .field select:focus { border-color: #d4af37; }
        .field select option { background: #1c1d1d; color: #fff; }

        .submit-btn {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #c59b27 0%, #e5c060 50%, #c59b27 100%);
            color: #1c1d1d; border: none; padding: 13px; border-radius: 25px;
            font-size: 1.02rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 6px 22px rgba(197, 155, 39, 0.35);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: transform 0.2s;
        }
        .submit-btn:hover { transform: translateY(-2px); }

        .toast {
            display: none; margin-top: 14px; padding: 10px 14px; border-radius: 10px;
            font-size: 0.88rem; text-align: center;
        }
        .toast.ok { display: block; background: rgba(37, 211, 102, 0.12); color: #6ee79a; border: 1px solid rgba(37, 211, 102, 0.3); }
        .toast.err { display: block; background: rgba(192, 57, 43, 0.15); color: #ff8f82; border: 1px solid rgba(192, 57, 43, 0.4); }

        .list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
        .list-head h2 { margin-bottom: 0; }
        .clear-btn {
            background: none; border: 1px solid rgba(192, 57, 43, 0.5); color: #ff8f82;
            padding: 7px 16px; border-radius: 18px; cursor: pointer; font-size: 0.82rem; font-weight: 600;
        }
        .clear-btn:hover { background: rgba(192, 57, 43, 0.15); }

        .product-list { display: flex; flex-direction: column; gap: 10px; }
        .product-row {
            display: flex; align-items: center; gap: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px; padding: 12px 16px;
        }
        .product-row .row-icon { color: #d4af37; font-size: 1.3rem; width: 28px; text-align: center; }
        .product-row .row-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .row-name { font-weight: 700; color: #e5c060; font-size: 0.95rem; }
        .row-meta { font-size: 0.78rem; color: #aaa; }
        .row-price { font-weight: 700; color: #e5c060; font-size: 0.95rem; white-space: nowrap; }
        .row-tag { font-size: 0.68rem; padding: 3px 9px; border-radius: 10px; font-weight: 700; }
        .row-tag.special { background: linear-gradient(135deg, #c59b27, #e5c060); color: #1c1d1d; }
        .row-tag.limited { background: linear-gradient(135deg, #8a1f1f, #c0392b); color: #fff; }
        .del-btn {
            background: rgba(192, 57, 43, 0.12); border: 1px solid rgba(192, 57, 43, 0.4);
            color: #ff8f82; width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .del-btn:hover { background: #c0392b; color: #fff; }
        .empty { text-align: center; color: #999; padding: 26px 10px; font-size: 0.92rem; }

        .note {
            width: 100%; font-size: 0.8rem; color: #b9b9b9; opacity: 0.8; line-height: 1.8;
            text-align: center; margin-bottom: 30px;
        }

        @media (max-width: 640px) {
            .form-grid { grid-template-columns: 1fr; }
            .hero-title { font-size: 1.7rem; }
            .product-row { flex-wrap: wrap; }
        }

        .tags-group { grid-column: 1 / -1; display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
        .tags-group label { display: flex; align-items: center; gap: 8px; color: #e0e0e0; font-size: 0.92rem; cursor: pointer; }
        .tags-group input { accent-color: #d4af37; width: 17px; height: 17px; }
        .row-tag.tried { background: linear-gradient(135deg, #1e7a46, #2ecc71); color: #fff; }
        .row-disc { font-size: 0.68rem; padding: 3px 9px; border-radius: 10px; font-weight: 800; background: linear-gradient(135deg, #b8860b, #ff5e3a); color: #fff; }
        .row-old { font-size: 0.75rem; color: #888; text-decoration: line-through; }
        .price-col { display: flex; flex-direction: column; align-items: flex-end; }

        .img-field { grid-column: 1 / -1; }
        .img-field input[type=file] { padding: 9px 12px; cursor: pointer; }
        .img-preview { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
        .img-preview img { width: 90px; height: 90px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(212,175,55,0.35); }
        .img-remove { background: none; border: 1px solid rgba(192,57,43,0.5); color: #ff8f82; padding: 6px 14px; border-radius: 16px; cursor: pointer; font-size: 0.8rem; }
        .row-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(212,175,55,0.3); }

        .thanks-banner {
            width: 100%; max-width: 700px; margin: 50px auto 20px; text-align: center; padding: 30px 22px;
            background: radial-gradient(circle at 50% 0%, rgba(212,175,55,0.14), rgba(0,0,0,0.25) 70%);
            border: 1px solid rgba(212,175,55,0.45); border-radius: 22px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.45);
        }
        .thanks-banner .thanks-orn { color: #d4af37; letter-spacing: 4px; font-size: 1.05rem; opacity: 0.9; }
        .thanks-banner .thanks-title {
            font-size: 1.9rem; font-weight: 800; margin: 12px 0 8px;
            background: linear-gradient(135deg, #c59b27, #f3d98b, #c59b27);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .thanks-banner .thanks-text { color: #e0e0e0; font-size: 0.98rem; line-height: 2; }
        .thanks-banner .thanks-sign { color: #e5c060; font-weight: 700; margin-top: 12px; }
</style>
</head>
<body>
<img src="images/WhatsApp Image 2026-11-21 at 12.47.41 PM.jpeg" alt="" class="bg-photo">
<div class="bg-overlay"></div>
<div class="main-container">
<header class="navbar">
<div>
<div class="brand-name">العطار محمد</div>
<div class="brand-sub">لوحة إدارة المنتجات</div>
</div>
</header>

<a href="products_1.html" class="back-link"><i class="fa-solid fa-arrow-right"></i> عرض صفحة المنتجات</a>

<h1 class="hero-title">إدخال المنتجات</h1>
<p class="hero-subtitle">أضف المنتجات أو احذفها، وستظهر مباشرة في صفحة المنتجات</p>

<section class="panel">
<h2><i class="fa-solid fa-circle-plus"></i> إضافة منتج جديد</h2>
<form id="productForm" class="form-grid" autocomplete="off">
<div class="field">
<label for="pName">اسم المنتج</label>
<input type="text" id="pName" placeholder="مثال: زيت اللافندر النقي" required maxlength="80">
</div>
<div class="field">
<label for="pPrice">السعر (ر.ع)</label>
<input type="number" id="pPrice" placeholder="مثال: 12.500" step="0.001" min="0" required>
</div>
<div class="field">
<label for="pCat">التصنيف</label>
<select id="pCat">
<option value="oils">زيوت طبيعية</option>
<option value="remedies">علاجات طبيعية</option>
<option value="ruqyah">علاج المس والسحر</option>
<option value="soap">صابون & شامبو</option>
<option value="tea">شاي & قهوة</option>
<option value="other">منتجات أخرى</option>
</select>
</div>
<div class="field">
<label for="pDisc">نسبة الخصم % (اختياري)</label>
<input type="number" id="pDisc" placeholder="مثال: 20" min="0" max="99" step="1">
</div>
<div class="field img-field">
<label for="pImage">صورة المنتج (اختياري)</label>
<input type="file" id="pImage" accept="image/*">
<div class="img-preview" id="imgPreview" style="display:none;">
<img id="imgPreviewTag" alt="معاينة">
<button type="button" class="img-remove" id="imgRemove"><i class="fa-solid fa-xmark"></i> إزالة الصورة</button>
</div>
</div>
<div class="tags-group">
<label><input type="checkbox" name="pTags" value="tried"> مجرب</label>
<label><input type="checkbox" name="pTags" value="special"> مميز</label>
<label><input type="checkbox" name="pTags" value="limited"> كمية محدودة</label>
</div>
<button type="submit" class="submit-btn"><i class="fa-solid fa-plus"></i> إضافة المنتج</button>
</form>
<div id="toast" class="toast"></div>
</section>

<section class="panel">
<div class="list-head">
<h2><i class="fa-solid fa-boxes-stacked"></i> المنتجات الحالية (<span id="count">0</span>)</h2>
<button class="clear-btn" id="clearAll"><i class="fa-solid fa-trash"></i> حذف الكل</button>
</div>
<div class="product-list" id="productList"></div>
</section>

<p class="note"><i class="fa-solid fa-circle-info"></i> المنتجات تُحفظ في هذا المتصفح (على هذا الجهاز). لا تضع رابط هذه الصفحة في القائمة العامة، واحتفظ به لنفسك.</p>

</div>

<script>
const PRODUCTS_KEY = 'attar_products';

const catLabels = { oils: 'زيوت طبيعية', remedies: 'علاجات طبيعية', ruqyah: 'علاج المس والسحر', soap: 'صابون & شامبو', tea: 'شاي & قهوة', other: 'منتجات أخرى' };
const catIcons  = { oils: 'fa-bottle-droplet', remedies: 'fa-leaf', ruqyah: 'fa-book-quran', soap: 'fa-pump-soap', tea: 'fa-mug-hot', other: 'fa-box-open' };
const tagLabels = { tried: 'مجرب', special: 'مميز', limited: 'كمية محدودة' };

function loadProducts() {
    try { return JSON.parse(localStorage.getItem(PRODUCTS_KEY)) || []; } catch (e) { return []; }
}
function saveProducts(list) {
    try { localStorage.setItem(PRODUCTS_KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
}
let currentImage = '';

function compressImage(file, maxSize, quality) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
            const img = new Image();
            img.onerror = reject;
            img.onload = () => {
                const ratio = Math.min(1, maxSize / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * ratio);
                canvas.height = Math.round(img.height * ratio);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.src = reader.result;
        };
        reader.readAsDataURL(file);
    });
}

function setPreview(dataUrl) {
    currentImage = dataUrl || '';
    document.getElementById('imgPreview').style.display = currentImage ? 'flex' : 'none';
    document.getElementById('imgPreviewTag').src = currentImage;
    if (!currentImage) document.getElementById('pImage').value = '';
}

document.getElementById('pImage').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) { setPreview(''); return; }
    if (!file.type.startsWith('image/')) { showToast('الملف المختار ليس صورة', 'err'); setPreview(''); return; }
    try {
        setPreview(await compressImage(file, 500, 0.8));
    } catch (err) {
        showToast('تعذّر قراءة الصورة', 'err');
        setPreview('');
    }
});
document.getElementById('imgRemove').addEventListener('click', () => setPreview(''));

function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type;
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { t.className = 'toast'; }, 2500);
}

function render() {
    const list = loadProducts();
    document.getElementById('count').textContent = list.length;
    const box = document.getElementById('productList');
    if (!list.length) {
        box.innerHTML = '<p class="empty">لا توجد منتجات. أضف أول منتج من النموذج أعلاه.</p>';
        return;
    }
    box.innerHTML = list.map(p => `
        <div class="product-row">
            ${p.image ? `<img class="row-thumb" src="${p.image}" alt="">` : `<i class="fa-solid ${esc(p.icon)} row-icon"></i>`}
            <div class="row-info">
                <span class="row-name">${esc(p.name)}</span>
                <span class="row-meta">${catLabels[p.category] || ''}</span>
            </div>
            ${(Array.isArray(p.tags) ? p.tags : (p.tag ? [p.tag] : [])).map(t => `<span class="row-tag ${esc(t)}">${tagLabels[t] || ''}</span>`).join('')}
            ${p.discount > 0 ? `<span class="row-disc">خصم ${esc(p.discount)}%</span>` : ''}
            <div class="price-col">${p.oldPrice ? `<span class="row-old">${esc(p.oldPrice)}</span>` : ''}<span class="row-price">${esc(p.price)}</span></div>
            <button class="del-btn" title="حذف" onclick="deleteProduct('${esc(p.id)}')"><i class="fa-solid fa-trash"></i></button>
        </div>
    `).join('');
}

function deleteProduct(id) {
    const list = loadProducts();
    const item = list.find(p => p.id === id);
    if (!item) return;
    if (!confirm('حذف المنتج: ' + item.name + ' ؟')) return;
    saveProducts(list.filter(p => p.id !== id));
    render();
    showToast('تم حذف المنتج', 'ok');
}

document.getElementById('clearAll').addEventListener('click', () => {
    if (!loadProducts().length) return;
    if (!confirm('هل تريد حذف جميع المنتجات؟')) return;
    saveProducts([]);
    render();
    showToast('تم حذف جميع المنتجات', 'ok');
});

document.getElementById('productForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('pName').value.trim();
    const priceNum = parseFloat(document.getElementById('pPrice').value);
    const category = document.getElementById('pCat').value;
    const tags = Array.from(document.querySelectorAll('input[name="pTags"]:checked')).map(c => c.value);
    let disc = parseFloat(document.getElementById('pDisc').value) || 0;
    if (disc < 0 || disc > 99) { showToast('نسبة الخصم يجب أن تكون بين 0 و 99', 'err'); return; }

    if (!name || isNaN(priceNum) || priceNum < 0) {
        showToast('تأكد من إدخال الاسم والسعر بشكل صحيح', 'err');
        return;
    }

    const list = loadProducts();
    list.push({
        id: 'p' + Date.now() + Math.floor(Math.random() * 1000),
        category: category,
        icon: catIcons[category],
        name: name,
        price: (priceNum * (1 - disc / 100)).toFixed(3) + ' ر.ع',
        oldPrice: disc > 0 ? priceNum.toFixed(3) + ' ر.ع' : '',
        discount: disc,
        tags: tags,
        image: currentImage
    });

    if (!saveProducts(list)) {
        showToast('تعذّر حفظ المنتج في هذا المتصفح', 'err');
        return;
    }
    e.target.reset();
    setPreview('');
    render();
    showToast('تمت إضافة المنتج بنجاح', 'ok');
});

render();
</script>
</body>
</html>
